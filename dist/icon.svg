<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#04050a" />
    </radialGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b6b" />
      <stop offset="0.17" stop-color="#ffb13b" />
      <stop offset="0.34" stop-color="#f3ff5b" />
      <stop offset="0.5" stop-color="#3bff9e" />
      <stop offset="0.67" stop-color="#3bdcff" />
      <stop offset="0.84" stop-color="#9a6bff" />
      <stop offset="1" stop-color="#ff5bd0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- apex: black-void upside-down triangle with a holographic rainbow outline -->
  <path d="M 132 168 L 380 168 L 256 384 Z"
